<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Calendar</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="calendar">

            <div class="calendar-header">

    <button id="prevBtn">&#10094;</button>

    <div class="header-center">

        <select id="monthSelect"></select>

        <select id="yearSelect"></select>

    </div>

    <button id="nextBtn">&#10095;</button>

</div>

<div class="toolbar">

    <button id="todayBtn">Today</button>

</div>

<div class="summary">

    <div class="card">
        <span>Present</span>
        <h2 id="presentCount">0</h2>
    </div>

    <div class="card">
        <span>Total Days</span>
        <h2 id="totalDays">0</h2>
    </div>

    <div class="card">
        <span>Attendance %</span>
        <h2 id="attendancePercent">0%</h2>
    </div>

</div>

<div class="legend">

    <div>
        <span class="legend-box present-box"></span>
        Present
    </div>

    <div>
        <span class="legend-box today-box"></span>
        Today
    </div>

    <div>
        <span class="legend-box holiday-box"></span>
        Holiday
    </div>

</div>

            <div class="weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>

            <div id="calendarDays" class="calendar-days">

            </div>

        </div>

    </div>

<!-- Attendance Modal -->

<div id="attendanceModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalDate"></h2>

            <button id="closeModal">&times;</button>

        </div>

        <div class="modal-body">

            <label>Status</label>

            <select id="statusSelect">

                <option value="none">None</option>
                <option value="present">Present</option>
                <option value="holiday">Holiday</option>

            </select>

            <label>Remark</label>

            <textarea id="remarkText"
                      rows="4"
                      placeholder="Write remark..."></textarea>

        </div>

        <div class="modal-footer">

            <button id="deleteBtn">Delete</button>

            <button id="saveBtn">Save</button>

        </div>

    </div>

</div>
    <script type="module" src="js/app.js"></script>

</body>

</html>
